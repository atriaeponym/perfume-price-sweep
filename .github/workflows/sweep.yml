name: sweep

# Every morning the search index is rebuilt from the shops' sitemaps (src/sitemaps.ts); then, twice a day, the price
# of every indexed perfume page, one job per shop side by side: each run reads the pages not read for 20 hours,
# oldest first, for at most 5 h 30 (src/sweep.ts). Notino, the slowest (a browser), is read in three parts side by
# side. Parfumdo, Parfums Moins Chers and Perfumes Club refuse these runners: they are read elsewhere.
on:
  schedule:
    - cron: '7 4 * * *'
    - cron: '7 16 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'reading time per shop, in minutes'
        default: '330'
      shops:
        description: 'shops to read, as a JSON list (empty: all)'
        default: ''
      index:
        description: 'rebuild the search index first'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  index:
    if: github.event.schedule == '7 4 * * *' || inputs.index
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Search index
        env:
          SUPABASE_URL: https://nvhprfxakvcryxxnpcqo.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node src/index-main.ts

  sweep:
    needs: index
    if: ${{ !cancelled() }}
    concurrency: sweep-${{ matrix.shop }}
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        shop: ${{ fromJSON(inputs.shops || '["parfumsetmoi", "notino.0of3", "notino.1of3", "notino.2of3", "parfumdreams", "myorigines", "sabina", "marionnaud", "lookfantastic"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run -s typecheck
      - name: Sweep
        env:
          SUPABASE_URL: https://nvhprfxakvcryxxnpcqo.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node src/sweep-main.ts ${{ matrix.shop }} ${{ inputs.minutes || '330' }}
